<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F5EDE8"/>
      <stop offset="100%" stop-color="#EDE4DC"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E8D5C8"/>
      <stop offset="100%" stop-color="#D4BFB0"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EF"/>
      <stop offset="100%" stop-color="#EDE4DC"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle abstract shape behind head -->
  <ellipse cx="200" cy="190" rx="110" ry="130" fill="#F0E6E0" opacity="0.6"/>

  <!-- Neck / shoulders hint -->
  <path d="M140 340 Q140 300 160 280 L160 260 Q200 270 240 260 L240 280 Q260 300 260 340 Z" fill="url(#shirt)" opacity="0.9"/>

  <!-- Hair - short, modern -->
  <path d="M115 170 Q115 100 200 95 Q285 100 285 170 Q280 150 200 145 Q120 150 115 170 Z" fill="#3D2B1F"/>
  <path d="M115 170 Q130 155 155 150 Q120 160 115 170 Z" fill="#2A1E14"/>
  <path d="M285 170 Q270 155 245 150 Q280 160 285 170 Z" fill="#2A1E14"/>

  <!-- Face shape -->
  <ellipse cx="200" cy="195" rx="72" ry="88" fill="url(#face)"/>

  <!-- Ears -->
  <ellipse cx="128" cy="200" rx="10" ry="14" fill="#D4BFB0"/>
  <ellipse cx="272" cy="200" rx="10" ry="14" fill="#D4BFB0"/>

  <!-- Eyebrows -->
  <path d="M158 175 Q172 170 186 173" stroke="#3D2B1F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M214 173 Q228 170 242 175" stroke="#3D2B1F" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes - relaxed, confident gaze -->
  <ellipse cx="172" cy="190" rx="11" ry="7" fill="#1A1A1A"/>
  <ellipse cx="228" cy="190" rx="11" ry="7" fill="#1A1A1A"/>
  <!-- Eye shine -->
  <circle cx="175" cy="188" r="3" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="231" cy="188" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Nose -->
  <path d="M200 198 L196 220 Q200 224 204 220 Z" fill="#C9AEA0" opacity="0.6"/>

  <!-- Mouth - slight confident smile -->
  <path d="M182 238 Q200 248 218 238" stroke="#B08878" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Subtle cheek warmth -->
  <ellipse cx="155" cy="215" rx="18" ry="10" fill="#E8B4A0" opacity="0.15"/>
  <ellipse cx="245" cy="215" rx="18" ry="10" fill="#E8B4A0" opacity="0.15"/>

  <!-- Jawline definition -->
  <path d="M145 240 Q140 265 155 285" stroke="#C9AEA0" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M255 240 Q260 265 245 285" stroke="#C9AEA0" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Initials overlay - subtle bottom right -->
  <text x="370" y="385" font-family="Cormorant Garamond, serif" font-size="11" fill="#C8B8E8" opacity="0.5" text-anchor="end" letter-spacing="2">K</text>
</svg>
