# Jekyll configuration for reform. brand website
# Exclude unnecessary folders from Jekyll processing

exclude:
  - scripts/
  - node_modules/
  - reform-brand-v2/
  - airtable/
  - figma/
  - knowledge/
  - memory/
  - mv-project/
  - nagoya-airbnb-investment/
  - nagoya-trip-2026/
  - open-design/
  - reform-website-v5/
  - reform-website/
  - research/
  - tmp/
  - "*.md"
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - .gitignore
  - .DS_Store
  - "*.mp3"
  - "*.png"
  - "*.jpg"
  - "*.jpeg"

# Ensure SVG files are included
include:
  - assets/
  - css/
  - images/
  - fonts/
